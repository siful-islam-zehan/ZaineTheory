<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="sketch">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0"/>
    </filter>
  </defs>
  <rect width="400" height="520" fill="url(#vignette)"/>
  
  <!-- Classic Engraving Portrait of Sir Isaac Newton -->
  <g fill="#18181b">
    <!-- Wavy long baroque hair -->
    <path d="M120 130 C100 170, 70 240, 80 340 C85 390, 110 430, 140 440 C125 380, 120 300, 140 230 C150 170, 155 140, 165 120 Z"/>
    <path d="M280 130 C300 170, 330 240, 320 340 C315 390, 290 430, 260 440 C275 380, 280 300, 260 230 C250 170, 245 140, 235 120 Z"/>
    <path d="M140 100 C170 80, 230 80, 260 100 C275 120, 280 150, 275 180 C270 150, 250 130, 200 130 C150 130, 130 150, 125 180 C120 150, 125 120, 140 100 Z"/>
    
    <!-- Hair curls details -->
    <path d="M100 230 C85 270, 95 310, 110 350 C100 310, 95 270, 105 235 Z" fill="#27272a"/>
    <path d="M300 230 C315 270, 305 310, 290 350 C300 310, 305 270, 295 235 Z" fill="#27272a"/>

    <!-- Head & Face structure -->
    <path d="M150 160 C150 250, 160 300, 200 310 C240 300, 250 250, 250 160 C250 140, 240 130, 200 130 C160 130, 150 140, 150 160 Z" fill="#f4f4f5"/>
    
    <!-- Eyebrows, Eyes, Nose, Lips (Engraving Lines) -->
    <!-- Brow -->
    <path d="M165 195 Q185 190 195 196 M235 195 Q215 190 205 196" stroke="#18181b" stroke-width="3" fill="none"/>
    <!-- Eyes -->
    <path d="M170 205 Q180 200 190 206 Q180 212 170 205" fill="#18181b"/>
    <path d="M230 205 Q220 200 210 206 Q220 212 230 205" fill="#18181b"/>
    <!-- Nose -->
    <path d="M200 198 L203 240 Q197 248 190 248 M203 248 Q210 248 214 242" stroke="#18181b" stroke-width="2.5" fill="none"/>
    <!-- Lips & Chin -->
    <path d="M185 268 Q200 265 215 268 Q200 273 185 268" fill="#18181b"/>
    <path d="M192 284 Q200 286 208 284" stroke="#18181b" stroke-width="2" fill="none"/>
    
    <!-- Robe & Neck Cloth (17th century scholar garb) -->
    <path d="M130 380 L185 320 L215 320 L270 380 L290 520 L110 520 Z" fill="#18181b"/>
    <!-- White cravat/collar -->
    <path d="M180 320 L220 320 L225 390 L200 410 L175 390 Z" fill="#ffffff" stroke="#e4e4e7"/>
    <path d="M200 330 L200 400" stroke="#71717a" stroke-width="1.5"/>
  </g>
  
  <!-- Subtle Vintage Border -->
  <rect x="12" y="12" width="376" height="496" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="16" y="16" width="368" height="488" fill="none" stroke="#27272a" stroke-width="0.75"/>
</svg>