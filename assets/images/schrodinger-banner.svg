<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="waveG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="240" fill="url(#sbg)"/>
  
  <!-- Wave function Ψ grid -->
  <g stroke="#334155" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
  </g>
  
  <!-- Superposition waveform -->
  <path d="M0 120 Q 75 30, 150 120 T 300 120 T 450 120 T 600 120" fill="none" stroke="url(#waveG)" stroke-width="3"/>
  <path d="M0 120 Q 75 210, 150 120 T 300 120 T 450 120 T 600 120" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Conceptual Box & Cat Silhouette in wireframe -->
  <rect x="250" y="70" width="100" height="100" fill="rgba(15,23,42,0.8)" stroke="#22c55e" stroke-width="1.5"/>
  <path d="M280 150 L280 130 Q285 110 300 110 Q315 110 320 130 L320 150 Z" fill="none" stroke="#facc15" stroke-width="2"/>
  <polygon points="280,120 286,105 292,118" fill="#facc15"/>
  <polygon points="308,118 314,105 320,120" fill="#facc15"/>
  <text x="300" y="195" fill="#e2e8f0" font-size="11" font-family="monospace" text-anchor="middle">|Alive⟩ + |Decayed⟩</text>
</svg>