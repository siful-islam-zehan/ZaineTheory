<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="qbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="240" fill="url(#qbg)"/>
  
  <!-- Entangled Wave strings -->
  <path d="M50 120 C150 40, 200 200, 300 120 C400 40, 450 200, 550 120" stroke="url(#neonG)" stroke-width="4" fill="none" filter="url(#glow)"/>
  <path d="M50 120 C150 200, 200 40, 300 120 C400 200, 450 40, 550 120" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,6" fill="none"/>
  
  <!-- Entangled Twin Particles -->
  <circle cx="120" cy="90" r="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="120" cy="90" r="6" fill="#ffffff"/>
  <text x="120" y="70" fill="#38bdf8" font-size="12" font-family="monospace" text-anchor="middle">|Ψ+⟩</text>

  <circle cx="480" cy="150" r="14" fill="#ec4899" filter="url(#glow)"/>
  <circle cx="480" cy="150" r="6" fill="#ffffff"/>
  <text x="480" y="180" fill="#ec4899" font-size="12" font-family="monospace" text-anchor="middle">|Ψ-⟩</text>

  <!-- Interference dots -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="200" cy="80" r="1.5"/>
    <circle cx="240" cy="160" r="1.5"/>
    <circle cx="360" cy="140" r="1.5"/>
    <circle cx="420" cy="70" r="1.5"/>
  </g>
</svg>