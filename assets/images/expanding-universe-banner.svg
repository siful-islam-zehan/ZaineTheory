  </defs>
  <rect width="600" height="240" fill="url(#spaceG)"/>
  
  <!-- Redshift Doppler waves -->
  <g fill="none" stroke="#ef4444" opacity="0.7">
    <circle cx="120" cy="120" r="30" stroke-width="1"/>
    <circle cx="120" cy="120" r="60" stroke-width="1.2"/>
    <circle cx="120" cy="120" r="100" stroke-width="1.4"/>
    <circle cx="120" cy="120" r="150" stroke-width="1.6"/>
    <circle cx="120" cy="120" r="220" stroke-width="1.8"/>
    <circle cx="120" cy="120" r="310" stroke-width="2"/>
    <circle cx="120" cy="120" r="420" stroke-width="2.5"/>
  </g>
  
  <!-- Galaxies & Stars -->
  <circle cx="120" cy="120" r="8" fill="#fbbf24"/>
  <ellipse cx="280" cy="90" rx="20" ry="8" fill="#38bdf8" transform="rotate(-25 280 90)"/>
  <ellipse cx="450" cy="150" rx="35" ry="12" fill="#ef4444" transform="rotate(15 450 150)"/>
  <text x="450" y="195" fill="#f87171" font-size="11" font-family="monospace" text-anchor="middle">z = 7.5 (Redshift)</text>
