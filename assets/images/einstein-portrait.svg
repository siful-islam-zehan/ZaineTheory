<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <rect width="300" height="400" fill="#18181b"/>
  <!-- Vignette -->
  <radialGradient id="einG" cx="50%" cy="40%" r="55%">
    <stop offset="0%" stop-color="#3f3f46"/>
    <stop offset="100%" stop-color="#09090b"/>
  </radialGradient>
  <rect width="300" height="400" fill="url(#einG)"/>
  
  <!-- Silhouette & Engraving of Albert Einstein -->
  <g fill="#e4e4e7">
    <!-- Wild Hair -->
    <path d="M70 180 C40 140, 50 80, 100 60 C120 40, 180 40, 200 60 C250 80, 260 140, 230 180 C240 220, 220 260, 210 270 C220 230, 215 190, 205 160 C195 120, 175 100, 150 100 C125 100, 105 120, 95 160 C85 190, 80 230, 90 270 C80 260, 60 220, 70 180 Z" opacity="0.95"/>
    
    <!-- Face Contour -->
    <path d="M100 150 C100 230, 110 280, 150 285 C190 280, 200 230, 200 150 C200 130, 190 120, 150 120 C110 120, 100 130, 100 150 Z" fill="#d4d4d8"/>
    
    <!-- Features -->
    <path d="M115 180 Q130 175 140 180 M185 180 Q170 175 160 180" stroke="#18181b" stroke-width="2.5" fill="none"/>
    <circle cx="128" cy="190" r="4" fill="#18181b"/>
    <circle cx="172" cy="190" r="4" fill="#18181b"/>
    <!-- Mustache -->
    <path d="M125 240 C140 235, 150 235, 150 240 C150 235, 160 235, 175 240 C185 245, 165 258, 150 252 C135 258, 115 245, 125 240 Z" fill="#27272a"/>
    <!-- Wrinkles -->
    <path d="M125 145 Q150 140 175 145 M128 155 Q150 150 172 155" stroke="#71717a" stroke-width="1.5" fill="none"/>
    
    <!-- Coat & Sweater -->
    <path d="M60 400 L95 295 L150 315 L205 295 L240 400 Z" fill="#27272a"/>
    <path d="M125 310 L150 350 L175 310 Z" fill="#52525b"/>
  </g>
  <rect x="8" y="8" width="284" height="384" fill="none" stroke="#52525b" stroke-width="1"/>
</svg>